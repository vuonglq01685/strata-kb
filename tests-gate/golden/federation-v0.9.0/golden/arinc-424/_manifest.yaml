  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 150
    l3: 173
- id: '5.35'
  title: NAVAID Class (CLASS)
  summary: 'Defines NAVAID CLASS field (5-column code) for VHF navaids: facility type
