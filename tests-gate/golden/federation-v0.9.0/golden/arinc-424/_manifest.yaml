  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 1771
    l3: 1768
- id: '5.36'
  title: Latitude (LATITUDE)
  summary: 'Defines the LATITUDE field: N/S hemisphere plus degrees-minutes-seconds-hundredths,
