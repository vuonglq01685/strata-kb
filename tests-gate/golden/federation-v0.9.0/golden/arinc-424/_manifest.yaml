sections:
- id: '5'
  title: NAVIGATION DATA - FIELD DEFINITIONS
  summary: Introduces Chapter 5 field definitions and lists STAR/Profile Descent coding
    rules covering VM legs, initial fix assignment, vertical angle computation, and
    Route Type assignment.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 283
    l3: 482
- id: '5.1'
  title: General
  summary: Explains the field definition format used throughout Chapter 5 (name, abbreviation,
    description, source, length, character type) and general field justification rules.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 218
    l3: 324
- id: '5.2'
  title: Record Type (S/T)
  summary: Defines the Record Type field (S/T) indicating whether a record is standard
    (S) or tailored (T) data, used on all records, 1 alpha character.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 81
    l3: 105
- id: '5.3'
  title: Customer/Area Code (CUST/AREA)
  summary: Defines the Customer/Area Code field (CUST/AREA) for categorizing standard
    records by geographic AREA or tailored records by airline/customer code.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 205
    l3: 299
- id: '5.4'
  title: Section Code (SEC CODE)
  summary: Defines the Section Code field (SEC CODE) identifying the major navigation
    database section for a record, per Table 5-1, 1 alpha character.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 57
    l3: 65
- id: '5.5'
  title: Subsection Code (SUB CODE)
  summary: Defines the Subsection Code field (SUB CODE) locating a record's specific
    file within its major database Section per Table 5-1's encoding scheme.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 508
    l3: 552
- id: '5.6'
  title: Airport/Heliport Identifier (ARPT/HELI IDENT)
  summary: Defines the Airport/Heliport Identifier field (ARPT/HELI IDENT), typically
    the 4-character ICAO Location Identifier or Domestic Identifier for a record's
    airport/heliport.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 166
    l3: 231
- id: 5.6-x74
  title: COMMENTARY
  summary: 'Commentary on the Airport/Heliport Identifier field: covers unofficial
    temporary identifiers, distinction from ATA/IATA codes, and record types using
    the field.'
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 340
    l3: 548
- id: '5.7'
  title: Route Type (RT TYPE)
  summary: Defines the Route Type field (RT TYPE) coding Enroute Airway, Preferred
    Route, and SID/STAR/Approach route types and PBN qualifiers per Tables 5-2 through
    5-5.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 1338
    l3: 1278
- id: 5.7-x75
  title: Table 5-6 - Airport and Heliport SID Record
  summary: Details Route Type and Qualifier tables (5-6 to 5-9) for SID, STAR, and
    Approach records, covering PBN specs, RNP AR, and approach minimums.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 3079
    l3: 4327
- id: '5.8'
  title: Route Identifier (ROUTE IDENT)
  summary: Defines the Route Identifier field (ROUTE IDENT) naming Enroute Airway
    and Preferred Route flight routes, up to 5 or 10 characters, alpha/numeric.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 301
    l3: 388
- id: '5.9'
  title: SID/STAR Route Identifier (SID/STAR IDENT)
  summary: Defines the SID/STAR Route Identifier field (SID/STAR IDENT) naming departure/arrival
    procedures, max 6 alphanumeric characters, e.g., DEPU2, SCK4.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 128
    l3: 145
- id: '5.10'
  title: Approach Route Identifier (APPROACH IDENT)
  summary: Defines the Approach Route Identifier field (APPROACH IDENT) and its runway-dependent,
    circle-to-land, and helicopter identifier coding per Tables 5-10 to 5-13.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 942
    l3: 724
- id: 5.10-x77
  title: Table 5-14 - Helicopter Approach Procedures to Heliports and Coded to a Specific
    Pad Identifier
  summary: Defines Table 5-14 pad-identifier coding for helicopter approach procedures
    to heliports, with runway-dependent and helipad-specific identifier examples.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 380
    l3: 352
- id: '5.11'
  title: Transition Identifier (TRANS IDENT)
  summary: Defines the Transition Identifier field (TRANS IDENT) coding enroute-to-terminal,
    runway, and approach transitions per Route Type, per Table 5-15.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 829
    l3: 889
- id: '5.12'
  title: Sequence Number (SEQ NR)
  summary: Defines the Sequence Number field (SEQ NR) ordering route, boundary, and
    TAA records, with length varying 1-4 numeric characters by record type.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 605
    l3: 927
- id: '5.13'
  title: Fix Identifier (FIX IDENT)
  summary: Defines the Fix Identifier field (FIX IDENT), a 5-character code identifying
    waypoints, navaids, airports, or runways used as fixes.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 167
    l3: 189
- id: '5.14'
  title: ICAO Code (ICAO CODE)
  summary: Defines the ICAO Code field (ICAO CODE), a 2-character geographic identifier
    from ICAO Doc 7910, with U.S. sub-region digits appended to K.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 138
    l3: 164
- id: '5.16'
  title: Continuation Record Number (CONT NR)
  summary: Defines the Continuation Record Number field (CONT NR), sequencing continuation
    records (2-9 then A-Z) that extend a Primary Record beyond 132 columns.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 170
    l3: 245
- id: '5.17'
  title: Waypoint Description Code (DESC CODE)
  summary: Defines the 4-column Waypoint Description Code field (DESC CODE, columns
    40-43) marking waypoint type, overfly, stepdown, and approach-fix attributes per
    Table 5-16.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 1793
    l3: 1751
- id: '5.18'
  title: Boundary Code (BDY CODE)
  summary: Defines the Boundary Code field (BDY CODE) identifying the geographical
    area a route crosses into or from, per Table 5-17's area codes.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 257
    l3: 237
- id: '5.19'
  title: Level (LEVEL)
  summary: Defines the Level field (LEVEL) coding airway structure as B (All Altitudes),
    H (High Level), or L (Low Level), 1 alpha character.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 68
    l3: 80
- id: '5.20'
  title: Turn Direction (TURN DIR)
  summary: Defines the Turn Direction field (TURN DIR) coding terminal procedure and
    course-reversal turn direction as L, R, or E, 1 alpha character.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 88
    l3: 106
- id: '5.21'
  title: Path and Termination (PATH TERM)
  summary: Defines the Path and Termination field (PATH TERM) coding ATC terminal
    procedure leg geometry per Attachment 5's Path Terminator codes.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 82
    l3: 92
- id: '5.22'
  title: Turn Direction Valid (TDV)
  summary: Defines the Turn Direction Valid field (TDV), coded Y when a pre-leg turn
    is required before capturing a terminal procedure's Path Term.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 104
    l3: 109
- id: '5.23'
  title: Recommended NAVAID (RECD NAV)
  summary: Defines the Recommended NAVAID field (RECD NAV) identifying the reference
    facility (VOR, NDB, Localizer, TACAN, GLS, MLS) for a waypoint or airport.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 495
    l3: 655
- id: 5.23-x78
  title: Table 5-18 - Procedure Use
  summary: Table 5-18 defines which facility types (VORDME, Localizer, TACAN, NDB,
    ILSDME, GLS, MLS, etc.) are valid recommended navaids for each procedure use.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 895
    l3: 724
- id: '5.24'
  title: Theta (THETA)
  summary: Defines Theta (THETA), the magnetic bearing to a waypoint from its Recommended
    Navaid, in degrees/tenths with suppressed decimal point.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 127
    l3: 149
- id: '5.25'
  title: Rho (RHO)
  summary: Defines Rho (RHO), the geodesic distance in nautical miles/tenths from
    a waypoint's Recommended Navaid, with suppressed decimal point.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 140
    l3: 167
- id: '5.26'
  title: Outbound Magnetic Course (OB MAG CRS)
  summary: Defines Outbound Magnetic Course (OB MAG CRS), the published outbound course/heading/radial
    from a waypoint, in degrees/tenths, with T suffix for true courses.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 170
    l3: 212
- id: '5.27'
  title: Route Distance From, Holding Distance/Time (RTE DIST FROM, HOLD DIST/TIME)
  summary: 'Defines RTE DIST FROM / HOLD DIST/TIME field: leg distance (NM) or time
    (minutes) for airway, SID/STAR/approach, and holding records.'
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 248
    l3: 310
- id: '5.28'
  title: Inbound Magnetic Course (IB MAG CRS)
  summary: 'Defines IB MAG CRS field: published inbound magnetic (or true) course
    to a waypoint, used on Enroute Airways records.'
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 171
    l3: 209
- id: '5.29'
  title: Altitude Description (ALT DESC)
  summary: Defines ALT DESC field codes (+, -, blank, B, C, D, G, O) for how a waypoint
    altitude must be crossed in procedure records.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 729
    l3: 698
- id: '5.30'
  title: Altitude/Minimum Altitude
  summary: Defines Altitude/Minimum Altitude field (feet or FL) for airways (MEA/MFA),
    holding patterns, terminal procedure fixes, and preferred routes.
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 412
    l3: 739
- id: '5.31'
  title: File Record Number (FRN)
  summary: 'Defines FRN: a sequential 5-digit housekeeping record number (00001-99999)
    assigned to every record in the file.'
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 92
    l3: 152
- id: '5.32'
  title: Cycle Date (CYCLE)
  summary: 'Defines CYCLE field: the year and 28-day AIRAC cycle number in which a
    record was added or last revised.'
  status: summarized
  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 136
    l3: 171
- id: '5.33'
  title: VOR/NDB Identifier (VOR IDENT/NDB IDENT)
  summary: 'Defines VOR IDENT/NDB IDENT field: the 1-4 character official identifier
