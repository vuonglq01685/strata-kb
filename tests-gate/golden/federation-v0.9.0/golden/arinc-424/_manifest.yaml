  file: ch5-navigation-data-field-definitions
  tokens:
    l2: 190
    l3: 242
- id: '5.34'
  title: VOR/NDB Frequency (VOR/NDB FREQ)
  summary: 'Defines VOR/NDB FREQ field: the 5-digit VHF (MHz) or NDB (kHz) facility
