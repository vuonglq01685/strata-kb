sections:
- id: '2'
  title: GENERAL PROVISIONS
  summary: Introductory notes clarify State obligations for supplying meteorological
    information, State of Registry/Operator delegation under Article 83 bis, and joint
    operations agreements.
  status: summarized
  file: ch2-general-provisions
  tokens:
    l2: 348
    l3: 573
- id: '2.1'
  title: Objective, determination and provision of meteorological service
  summary: Standards require States to determine and provide meteorological service
    via a designated meteorological authority meeting WMO personnel qualification
    requirements.
  status: summarized
  file: ch2-general-provisions
  tokens:
    l2: 368
    l3: 585
- id: '2.2'
  title: Supply, use, quality management and interpretation of meteorological information
  summary: Standards mandate quality management systems for meteorological authorities;
    Recommendations urge ISO 9000 certification, with audit-verified compliance and
    accuracy safeguards.
  status: summarized
  file: ch2-general-provisions
  tokens:
    l2: 701
    l3: 1074
- id: '2.3'
  title: Notifications required from operators
  summary: Standards require operators to notify the meteorological authority of service
    needs and route/schedule changes; a Recommendation specifies flight notification
    details.
  status: summarized
  file: ch2-general-provisions
  tokens:
    l2: 361
    l3: 490
