[project]
name = "strata-kb"
version = "1.2.0"
description = "Knowledge Base as Code for large reference documents — 4 layers L0-L3, MCP server + web UI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lâm Quốc Vương" }]
keywords = ["knowledge-base", "mcp", "docs-as-code", "rag", "documentation", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "mcp>=1.2,<2",  # 2.0 removed mcp.server.fastmcp (our MCPServer) — repin when migrating
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# pypdfium2: page rasteriser for table-cell glyph crops (parser._render_page).
# docling pulls it in transitively today, but only through an extra of an
# extra — declare it so the crop path can never silently no-op.
ingest = [
    "docling>=2.0", "imagehash>=4.3", "Pillow>=10.0", "pypdfium2>=4.30,<6",
    # rapidocr: the second image-description source (images.ocr_image).
    # Without it captionless images silently lose their `Figure:` line.
    "rapidocr>=3.0",
]
dev = [
    "pytest>=8.0", "anyio>=4.0", "sqlite-vec>=0.1.6", "twine>=7.0", "build>=1.2",
    "PyJWT[crypto]>=2.8", "python-multipart>=0.0.9", "httpx>=0.27",
    "imagehash>=4.3", "Pillow>=10.0", "ruff>=0.15,<0.16",
]
embed = ["sqlite-vec>=0.1.6", "fastembed>=0.3"]
server = ["PyJWT[crypto]>=2.8", "python-multipart>=0.0.9"]
s3 = ["boto3>=1.34"]
# docs/src/build_pdf.py only — renders the role guides and architecture
# document to PDF. Not needed to install, run or test strata-kb itself.
docs = ["xhtml2pdf>=0.2", "markdown>=3.5"]

[project.scripts]
kb = "strata_kb.cli:app"

[project.urls]
Homepage = "https://github.com/vuonglq01685/strata-kb"
Issues = "https://github.com/vuonglq01685/strata-kb/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_kb"]

# hatchling's default sdist is "everything not covered by .gitignore" — .kb/
# (which holds text quoted verbatim from copyrighted PDFs), docs/, tests/,
# .claude/ etc. would all slip in because they are NOT gitignored. only-include
# stops the directory walk at the root and lets only src/ into the sdist.
# pyproject.toml, README and LICENSE are added by hatchling unconditionally
# (they cannot be excluded), so they need not be listed here. CHANGELOG.md is
# force-included below, sdist-only: a wheel-side force-include was measured to
# break `pip install -e ".[dev]"` and `uv sync --locked --extra dev` with
# FileNotFoundError, so release notes ship in the sdist only, not the wheel.
[tool.hatch.build.targets.sdist]
only-include = ["src"]
force-include = { "CHANGELOG.md" = "CHANGELOG.md" }

[tool.ruff.lint]
# Default is E4/E7/E9/F only, which made "ruff check passed" mean very
# little: the 11 `# noqa: BLE001` markers in src/ were inert because BLE
# was never enabled, and RUF100 was not there to say so. B/I/UP/SIM are
# deliberately NOT here yet — 198 mechanical edits belong in their own PR.
select = ["E4", "E7", "E9", "F", "BLE", "RUF100", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip must run before the guarded import (E402); asserts are
# the pytest idiom (S101); every subprocess call under tests/ is a fixed
# git/python argv built from literal strings for fixture setup -- never
# shell=True, never network- or user-supplied data (S603/S607); every
# hardcoded token/password/tempfile path here is a literal test fixture
# value, never a real credential (S105/S106/S107/S108).
"tests/*" = ["E402", "S101", "S603", "S607", "S105", "S106", "S107", "S108"]

# Same test idioms as tests/*, plus S310: test_server.py's e2e helper opens a
# fixed http://127.0.0.1:<port> URL against a server this suite itself
# started, never user- or network-supplied. Needs its own entry, not a
# broader "tests/*" glob, because tests-gate/ nests real subdirectories
# (regression/, e2e/, golden/, fixtures/) that a plain "tests/*" glob does
# not reach.
"tests-gate/**" = [
    "E402", "S101", "S603", "S607", "S105", "S106", "S107", "S108", "S310",
]

# S603/S607: every subprocess call here is a fixed git argv built in code,
# never a shell string and never user-interpolated; this is the chokepoint
# for every git call except the two documented exceptions below (codeingest/
# core.py, publish.py) that deliberately bypass it.
"src/strata_kb/gitio.py" = ["S603", "S607"]

# S603/S607: fixed git argv (`_git`), same shape as gitio._run -- deliberately
# NOT routed through gitio because a non-git scratch dir is a valid
# code-ingest target and this helper must degrade gracefully instead of
# raising (see comment above `_git` in this file).
"src/strata_kb/codeingest/core.py" = ["S603", "S607"]

# S603/S607: fixed `gh` CLI argv built in code, never a shell string and
# never user-interpolated.
"src/strata_kb/ghio.py" = ["S603", "S607"]

# S603: cmd is built from shutil.which(name) where name is constrained to the
# literal "claude"/"copilot" candidates (detect_runner) -- never a shell
# string, never user-interpolated.
"src/strata_kb/llm.py" = ["S603"]

# S607: fixed `docker`/`docker compose` argv built in code, never a shell
# string and never user-interpolated.
"src/strata_kb/dockersetup.py" = ["S607"]

# S607: the one `git config` call here is a fixed literal argv, never a shell
# string and never user-interpolated.
"src/strata_kb/publish.py" = ["S607"]

# S603: verifies the freshly built venv's own `kb` executable during release
# checks -- path is built from the venv argument, not external input.
"scripts/check_package.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_embedder: test uses the real default_embedder (fastembed) — skipped by the autouse fixture",
]
