[project]
name = "aero-kb"
version = "0.1.0"
description = "Knowledge Base as Code cho tài liệu hàng không — 4 tầng L0-L3"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "mcp>=1.2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ingest = ["docling>=2.0"]
dev = ["pytest>=8.0", "anyio>=4.0", "sqlite-vec>=0.1.6"]
embed = ["sqlite-vec>=0.1.6", "fastembed>=0.3"]

[project.scripts]
kb = "aero_kb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aero_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
