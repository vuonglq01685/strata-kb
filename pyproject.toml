[project]
name = "center-kb"
version = "0.2.0"
description = "Knowledge Base as Code cho tài liệu hàng không — 4 tầng L0-L3, MCP server + web UI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lâm Quốc Vương" }]
keywords = ["aviation", "knowledge-base", "mcp", "docs-as-code", "arinc-424", "icao"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "mcp>=1.2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ingest = ["docling>=2.0"]
dev = ["pytest>=8.0", "anyio>=4.0", "sqlite-vec>=0.1.6"]
embed = ["sqlite-vec>=0.1.6", "fastembed>=0.3"]

[project.scripts]
kb = "center_kb.cli:app"

[project.urls]
Homepage = "https://github.com/vuonglq01685/CENTER-KB"
Issues = "https://github.com/vuonglq01685/CENTER-KB/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/center_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
