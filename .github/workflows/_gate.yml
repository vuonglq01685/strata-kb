# Shared verification gate. Both ci.yml (PR/main) and release.yml (tag) uses: it.
#
# INVARIANT: a tag runs NOTHING new compared to a PR. If you are about to add a
# step that "only runs on release", stop — that is exactly how the old pipeline
# let bugs slip through to the very last minute. Add it here, so PRs run it too.
#
# A tag runs LESS, never more: with `artifact_only: true` (release.yml) the
# source-tree tiers T0 and T1 are skipped, because release.yml first requires
# the full gate from ci.yml to be green on the very commit being tagged. The
# artifact tiers T2-T4 still run, on the artifact that is about to be published.
#
# Everything runs on GitHub-hosted runners: ubuntu-latest for every tier, plus
# windows-latest rows on T1, T3 and T4 so a Windows-only break is caught on the
# PR, not at release time.
name: gate
on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag on release (e.g. v0.9.1). Empty on PRs."
        type: string
        required: false
        default: ""
      artifact_only:
        description: "Skip T0/T1 (release: ci.yml already ran them on this SHA)."
        type: boolean
        required: false
        default: false

jobs:
  t0-lint:
    name: T0 lint (ruff, format, pyright)
    if: ${{ !inputs.artifact_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dev extra pins both tools: ruff upper-bounded (<0.16) and
      # pyright exact. Unbounded, a new ruff release could turn every open PR
      # red without a single line of code changing — which is exactly what
      # 0.16.0 did: it added default rules that flag 127 pre-existing
      # findings on `main` itself. A lint gate that upgrades itself is not a
      # gate.
      #
      # Adopting a new ruff minor or pyright release is a deliberate,
      # standalone change: bump the pin in pyproject.toml, run the three
      # steps below, and fix the fallout in its own PR where the diff is
      # reviewable. pyright needs the package and its dev dependencies
      # installed so imports resolve.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  t1-tests:
    name: T1 unit/integration (${{ matrix.os }}, py${{ matrix.python }})
    if: ${{ !inputs.artifact_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Defender scans every temp file and git object the suite writes; on
      # the hosted Windows runner that roughly doubles T1. The runner is
      # thrown away after the job.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # Fetch cl100k_base once, before xdist starts several workers that
      # would otherwise race to download and rename the same cache file.
      - run: python -c "from strata_kb.mdutils import count_tokens; count_tokens('warm')"
      # -n auto: one worker per vCPU (4 on hosted runners). --durations
      # keeps the slowest tests visible in the log.
      - run: pytest -q -n auto --durations=15
        env:
          # The e2e tests run `kb publish` / gitio.commit_* against a real git
          # clone — committing needs an identity, and the CI runner has no
          # ~/.gitconfig.
          GIT_AUTHOR_NAME: ci-test
          GIT_AUTHOR_EMAIL: ci-test@local
          GIT_COMMITTER_NAME: ci-test
          GIT_COMMITTER_EMAIL: ci-test@local

  t2-package:
    name: T2 packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - run: pip install build twine
      - run: python -m build
      - name: uv.lock in sync with pyproject
        run: uv lock --check
      - name: twine check (metadata + README rendering on PyPI)
        run: python -m twine check --strict dist/*
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/artifact
          /tmp/artifact/bin/pip install --quiet dist/*.whl
      - name: Version consistency + wheel contents
        run: python scripts/check_package.py --venv /tmp/artifact --dist dist --tag "${{ inputs.tag }}"
      - name: sdist installs into a clean venv (thin smoke test)
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet dist/*.tar.gz
          /tmp/sdist-venv/bin/kb --version
          /tmp/sdist-venv/bin/python -c "from importlib import resources; resources.files('strata_kb').joinpath('templates/web/base.html').read_text(encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  t3-e2e:
    name: T3 e2e on the artifact (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: t2-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Download the EXACT wheel that t2-package built (from the sdist — the one
      # that actually goes to PyPI, governed by the only-include of
      # [tool.hatch.build.targets.sdist]); do NOT rebuild it from the tree.
      # Rebuilding from the tree produces a wheel with a different provenance
      # than the published one — today they happen to have identical contents,
      # but nothing enforces that, and this tier EXISTS to black-box-test the
      # exact artifact that will ship, not one that merely looks like it.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Artifact venv (wheel ONLY)
        shell: bash
        run: |
          BIN=$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)
          python -m venv .venv-artifact
          ".venv-artifact/$BIN/pip" install --quiet dist/*.whl
      - name: Runner venv (pytest, WITHOUT strata-kb)
        shell: bash
        run: |
          BIN=$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)
          python -m venv .venv-runner
          ".venv-runner/$BIN/pip" install --quiet -r requirements-gate.txt
      - name: pytest tests-gate/e2e
        shell: bash
        run: |
          BIN=$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)
          KB_VENV=.venv-artifact ".venv-runner/$BIN/pytest" tests-gate/e2e -q

  t4-regression:
    name: T4 regression (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: t2-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Same reason as t3-e2e above: use the EXACT wheel that t2-package built
      # from the sdist, do not rebuild it from the tree.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Artifact venv (wheel ONLY)
        shell: bash
        run: |
          BIN=$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)
          python -m venv .venv-artifact
          ".venv-artifact/$BIN/pip" install --quiet dist/*.whl
      - name: Runner venv (pytest, WITHOUT strata-kb)
        shell: bash
        run: |
          BIN=$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)
          python -m venv .venv-runner
          ".venv-runner/$BIN/pip" install --quiet -r requirements-gate.txt
      - name: pytest tests-gate/regression
        shell: bash
        run: |
          BIN=$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)
          KB_VENV=.venv-artifact ".venv-runner/$BIN/pytest" tests-gate/regression -q
