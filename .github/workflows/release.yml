# Release: tag v* → the full gate (identical to PR, sharing _gate.yml) → and
# only then release/publish. Do NOT write tag-specific test logic here — see the
# INVARIANT at the top of _gate.yml: PRs and tags must run the same gate, no
# more and no less.
#
# Dependency graph (deliberate — it patches the L7 hole):
#   gate → docker-verify → pypi → docker-release
#
# PyPI is immutable — once a version is published it can NEVER be deleted or
# overwritten. Therefore: NOTHING irreversible is allowed to happen before the
# ENTIRE gate (gate + docker-verify) is green.
#   - docker-verify builds the image with a REAL `pip install center-kb[ingest]`
#     (see Dockerfile) → this is precisely the gatekeeper for the heavy extras
#     (docling/torch/rapidocr): if [ingest] does not resolve, PyPI will not be
#     touched at all (pypi needs docker-verify).
#   - docker-verify only pushes the `sha-<commit>` tag — harmless: it is not a
#     tag anyone is using (`latest`/`vX.Y.Z`), it can be deleted from GHCR at any
#     time, so this is NOT an irreversible action.
#   - `latest`/`vX.Y.Z` are ONLY pointed at (docker-release — retag-only via
#     `docker buildx imagetools create`, it does NOT rebuild the image) AFTER
#     `pypi` has published successfully. No other job is allowed to push these
#     two tags.
#
# The incident Task 11 uncovered, recorded so it is never repeated:
# `center-kb==0.9.0` NEVER made it to PyPI (PyPI jumped straight from 0.8.0 →
# 0.9.1) because in the OLD pipeline `docker` only had `needs: test` and ran in
# parallel with `pypi` — when `build`/`pypi` failed (post-0.9 `kb doctor`
# requires `--hub`, see d3d6e36), `docker` stayed green and pushed `:latest` as
# if nothing had happened, so nobody noticed that PyPI had silently failed. The
# sequential graph here exists EXACTLY so that cannot happen again: if `pypi` is
# red, `docker-release` is skipped — no new `:latest` image papers over a PyPI
# release that does not exist.
#
# NOTE for anyone tempted to "just tweak" this: `check_package.py` (run inside
# gate/t2-package) ONLY verifies that the tag matches the `pyproject.toml`
# version + the package contents (no tests/.kb/sources leaking in) — it does NOT
# check whether the version already exists on PyPI. The barrier against
# publishing a duplicate version comes from PyPI itself (immutable) + the default
# behaviour of `pypa/gh-action-pypi-publish` (hard failure if the file already
# exists). Do NOT turn on `skip-existing: true` and do NOT add
# `continue-on-error` to the `pypi` job — doing so recreates exactly the
# silent-failure hole described above.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml
    with:
      tag: ${{ github.ref_name }}

  docker-verify:
    name: Build image + smoke (not a release tag yet)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (a REAL pip install center-kb[ingest] — see Dockerfile)
        run: docker build -t ghcr.io/vuonglq01685/center-kb:sha-${GITHUB_SHA} .
      - name: Smoke — serve an empty KB; health must answer, the API must 401
        run: |
          # The hub is mandatory as of 0.9 (federation is the only read source) —
          # the Dockerfile's CMD runs `--hub /data`, so /data needs both .kb/ and
          # federation/ in order to boot, not just .kb/ as it did before 0.9.
          mkdir -p /tmp/data/.kb /tmp/data/federation
          echo "docs: []" > /tmp/data/.kb/index.yaml
          echo "docs: []" > /tmp/data/federation/index.yaml
          docker run -d --name kb -p 8321:8321 \
            -e CENTER_KB_HTTP_TOKEN=smoke-test-token \
            -v /tmp/data:/data \
            ghcr.io/vuonglq01685/center-kb:sha-${GITHUB_SHA}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8321/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8321/api/health
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8321/api/docs)
          test "$code" = "401"
          docker rm -f kb
      - name: Push the sha- tag (harmless — NOT a release tag, nobody pulls it)
        run: docker push ghcr.io/vuonglq01685/center-kb:sha-${GITHUB_SHA}

  pypi:
    name: Publish to PyPI (irreversible — comes after EVERY gate)
    needs: [gate, docker-verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4

  docker-release:
    name: Retag image → vX.Y.Z + latest (only after PyPI has published)
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Retag (no rebuild — just copies the manifest to the new tags, seconds)
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/vuonglq01685/center-kb:${GITHUB_REF_NAME} \
            --tag ghcr.io/vuonglq01685/center-kb:latest \
            ghcr.io/vuonglq01685/center-kb:sha-${GITHUB_SHA}
