# Release: tag v* → ci-green (the full ci.yml gate already passed on this exact
# commit) + the artifact tiers T2-T4 of _gate.yml → and only then
# release/publish. T0/T1 test the source tree, which is byte-identical to the
# commit ci.yml just tested, so they are not re-run here (`artifact_only`).
# Do NOT write tag-specific test logic here — see the INVARIANT at the top of
# _gate.yml: a tag never runs anything a PR does not.
#
# Dependency graph (deliberate — it patches the L7 hole):
#   ci-green + gate → docker-verify → pypi → docker-release
#
# PyPI is immutable — once a version is published it can NEVER be deleted or
# overwritten. Therefore: NOTHING irreversible is allowed to happen before the
# ENTIRE gate (gate + docker-verify) is green.
#   - docker-verify builds the image with a REAL `pip install strata-kb[ingest]`
#     (see Dockerfile) → this is precisely the gatekeeper for the heavy extras
#     (docling/torch/rapidocr): if [ingest] does not resolve, PyPI will not be
#     touched at all (pypi needs docker-verify).
#   - docker-verify only pushes the `sha-<commit>` tag — harmless: it is not a
#     tag anyone is using (`latest`/`vX.Y.Z`), it can be deleted from GHCR at any
#     time, so this is NOT an irreversible action.
#   - `latest`/`vX.Y.Z` are ONLY pointed at (docker-release — retag-only via
#     `docker buildx imagetools create`, it does NOT rebuild the image) AFTER
#     `pypi` has published successfully. No other job is allowed to push these
#     two tags.
#
# The incident Task 11 uncovered, recorded so it is never repeated:
# `strata-kb==0.9.0` NEVER made it to PyPI (PyPI jumped straight from 0.8.0 →
# 0.9.1) because in the OLD pipeline `docker` only had `needs: test` and ran in
# parallel with `pypi` — when `build`/`pypi` failed (post-0.9 `kb doctor`
# requires `--hub`, see d3d6e36), `docker` stayed green and pushed `:latest` as
# if nothing had happened, so nobody noticed that PyPI had silently failed. The
# sequential graph here exists EXACTLY so that cannot happen again: if `pypi` is
# red, `docker-release` is skipped — no new `:latest` image papers over a PyPI
# release that does not exist.
#
# NOTE for anyone tempted to "just tweak" this: `check_package.py` (run inside
# gate/t2-package) ONLY verifies that the tag matches the `pyproject.toml`
# version + the package contents (no tests/.kb/sources leaking in) — it does NOT
# check whether the version already exists on PyPI. The barrier against
# publishing a duplicate version comes from PyPI itself (immutable) + the default
# behaviour of `pypa/gh-action-pypi-publish` (hard failure if the file already
# exists). Do NOT turn on `skip-existing: true` and do NOT add
# `continue-on-error` to the `pypi` job — doing so recreates exactly the
# silent-failure hole described above.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag's commit must already have a green ci.yml run (normally the push to
  # main after the merge). Still running → wait for it; red, cancelled or never
  # run (e.g. superseded by a later push to main) → refuse: re-run ci.yml on
  # that commit, or tag the newer one.
  ci-green:
    name: Full CI gate green on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if echo "$runs" | jq -e 'any(.conclusion == "success")' >/dev/null; then
              echo "ci.yml is green on $GITHUB_SHA"; exit 0
            fi
            # An empty list right after the tag push: the run may not be registered yet.
            if [ "$runs" = "[]" ] && [ "$i" -le 5 ]; then sleep 60; continue; fi
            if ! echo "$runs" | jq -e 'any(.status != "completed")' >/dev/null; then
              echo "::error::no green ci.yml run on $GITHUB_SHA ($runs) — re-run ci.yml on this commit, or tag a commit whose CI is green"
              exit 1
            fi
            echo "ci.yml still running on $GITHUB_SHA — waiting ($i/80)"; sleep 60
          done
          echo "::error::ci.yml did not finish on $GITHUB_SHA in time"; exit 1

  gate:
    uses: ./.github/workflows/_gate.yml
    with:
      tag: ${{ github.ref_name }}
      artifact_only: true

  # docker-verify / pypi / docker-release need a Docker daemon and the heavy
  # [ingest] image build (torch, docling); ubuntu-latest has both.
  docker-verify:
    name: Build image + smoke (not a release tag yet)
    needs: [ci-green, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (a REAL pip install strata-kb[ingest] — see Dockerfile)
        run: docker build -t ghcr.io/vuonglq01685/strata-kb:sha-${GITHUB_SHA} .
      - name: Smoke — serve an empty KB; health must answer, the API must 401
        run: |
          # The hub is mandatory as of 0.9 (federation is the only read source) —
          # the Dockerfile's CMD runs `--hub /data`, so /data needs both .kb/ and
          # federation/ in order to boot, not just .kb/ as it did before 0.9.
          mkdir -p /tmp/data/.kb /tmp/data/federation
          echo "docs: []" > /tmp/data/.kb/index.yaml
          echo "docs: []" > /tmp/data/federation/index.yaml
          # The image runs as user `app` and, since 1.26.0, writes the account
          # store and session key to /data/.kb-auth/ at start; the runner owns
          # /tmp/data, so let `app` write there.
          chmod -R a+rwX /tmp/data
          docker run -d --name kb -p 8321:8321 \
            -e STRATA_KB_HTTP_TOKEN=smoke-test-token-0123456789abcdef0123456789 \
            -v /tmp/data:/data \
            ghcr.io/vuonglq01685/strata-kb:sha-${GITHUB_SHA}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8321/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8321/api/health || { docker logs kb; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8321/api/docs)
          test "$code" = "401"
          docker rm -f kb
      - name: Push the sha- tag (harmless — NOT a release tag, nobody pulls it)
        run: docker push ghcr.io/vuonglq01685/strata-kb:sha-${GITHUB_SHA}

  pypi:
    name: Publish to PyPI (irreversible — comes after EVERY gate)
    needs: [ci-green, gate, docker-verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  docker-release:
    name: Retag image → vX.Y.Z + latest (only after PyPI has published)
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Retag (no rebuild — just copies the manifest to the new tags, seconds)
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/vuonglq01685/strata-kb:${GITHUB_REF_NAME} \
            --tag ghcr.io/vuonglq01685/strata-kb:latest \
            ghcr.io/vuonglq01685/strata-kb:sha-${GITHUB_SHA}
