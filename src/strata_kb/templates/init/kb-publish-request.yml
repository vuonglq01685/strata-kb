# Merge = publish. A push to main that changes missions/ or tickets/ tags the
# merged commit kb-publish/<ts> and dispatches kb-publish.yml on that tag, so
# the intake still sees an OIDC ref of refs/tags/kb-publish/* (it refuses any
# other ref). A tag created with GITHUB_TOKEN does not trigger workflows, but
# workflow_dispatch does — hence the explicit dispatch. Run it by hand
# (workflow_dispatch on main) to republish without a content change. No one
# needs to push a tag, so it works where only the branch may be pushed.
# `kb publish` on a dev machine still works and pushes its own tag.
# A default branch other than main: change `main` in both places below.
name: kb-publish-request
on:
  push:
    branches: [main]
    paths: ["missions/**", "tickets/**"]
  workflow_dispatch:
permissions:
  contents: write   # create the kb-publish/<ts> tag
  actions: write    # dispatch kb-publish.yml
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tag the merged commit and dispatch kb-publish on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The short SHA keeps two pushes in one second from colliding.
          tag="kb-publish/$(date -u +%Y%m%d-%H%M%S)-${SHA::7}"
          api() {
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/$1" -d "$2"
          }
          api git/refs "{\"ref\":\"refs/tags/$tag\",\"sha\":\"$SHA\"}" > /dev/null
          # A just-created ref can lag behind the dispatch API: retry briefly.
          for attempt in 1 2 3 4 5; do
            if api actions/workflows/kb-publish.yml/dispatches "{\"ref\":\"$tag\"}"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "dispatch failed for $tag" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Dispatched kb-publish on $tag ($SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
