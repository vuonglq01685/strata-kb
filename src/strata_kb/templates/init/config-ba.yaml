# Strata — repo config (commit to git).
# kind: this repo's role. "ba" is a requirements repo — it drafts and
#       versions tickets grounded in the shared KB via the
#       ba-ticket-author skill. It publishes its plan (the ready
#       missions and tickets, as `<repo_id>-plan`) to the hub, never KB
#       content: it never ingests or summarizes (that's what `child`
#       repos do, reviewed on the `hub`).
kind: ba
# hub: git URL or kb-hub path of the MAIN HUB — used by `kb ticket lint`
#      and `kb query` to ground tickets in cited, versioned facts.
#      FILL THIS IN before drafting tickets.
#      This file is committed: never put a token in `hub:`. A URL that
#      needs one goes in the STRATA_KB_HUB environment variable, which
#      overrides this line (`kb doctor` warns on a committed credential).
hub: ""
# repo_id: repo name on the federation (pre-filled from the folder name).
#          Names the published `<repo_id>-plan` document and must match this
#          repo's entry in the hub's federation/registry.yaml.
repo_id: "{repo_id}"
# intake: https://kb.internal:8321   # enable publishing via OIDC CI (zero secrets in this repo)
intake: ""
