# Scheduled citation check (2026-10-10 review H14). `kb-ticket-lint` checks a
# ticket's citations when a PR touches it; a ticket that merged weeks ago is
# never looked at again, though the hub keeps publishing. This job sweeps
# every ticket and mission once a day and keeps ONE issue, labelled
# `kb-stale-citations`, in step with what it found: opened or rewritten while
# anything is stale or broken, closed once everything is current again.
#
# The hub is a repo variable and any auth token a repo secret, exactly as in
# kb-ticket-lint.yml. Scaffolded by `kb init --kind ba|dev` and regenerated by
# a later `kb init` -- a hand-edit here does not survive re-init.
name: kb-doctor
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
concurrency:
  group: kb-doctor
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  STRATA_KB_HUB: ${{ vars.STRATA_KB_HUB }}
  KB_HUB_TOKEN: ${{ secrets.KB_HUB_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  LABEL: kb-stale-citations
jobs:
  stale-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install strata-kb=={version}
      - name: Authenticate the hub URL (private hub only)
        if: env.KB_HUB_TOKEN != ''
        run: |
          scheme="${STRATA_KB_HUB%%://*}"
          rest="${STRATA_KB_HUB#*://}"
          echo "STRATA_KB_HUB=${scheme}://x-access-token:${KB_HUB_TOKEN}@${rest}" >> "$GITHUB_ENV"
      - name: Sweep tickets and missions
        id: sweep
        run: |
          # 0 = all current, 2 = stale only, 1 = a broken citation or an
          # error. Anything other than 0/1/2 is a crash: fail the job rather
          # than rewrite the issue from a half-written report.
          set +e
          kb ticket stale --md --hub "$STRATA_KB_HUB" > "$RUNNER_TEMP/stale.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/stale.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -gt 2 ]; then exit "$rc"; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Keep the stale-citations issue in step
        run: |
          gh label create "$LABEL" --color D93F0B \
            --description "Citations the hub has moved since they were pinned" \
            --force >/dev/null
          number="$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ "${{ steps.sweep.outputs.rc }}" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" \
                --comment "Every ticket and mission cites current hub content again."
            fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/stale.md"
          else
            gh issue create --label "$LABEL" \
              --title "Stale KB citations in tickets/missions" \
              --body-file "$RUNNER_TEMP/stale.md"
          fi
