# Scheduled drift check of the test strategy. `kb-test-lint` checks the
# strategy when a PR touches it; the hub keeps moving afterwards (a story is
# renamed, a ticket is amended). This job runs `kb test stale` once a day and
# keeps ONE issue, labelled `kb-test-stale`, in step with what it found:
# opened or rewritten while anything drifted, closed once nothing has. A
# finding never blocks testing.
#
# The hub is a repo variable and any auth token a repo secret, exactly as in
# kb-test-lint.yml. Scaffolded by `kb init --kind tester` and regenerated by
# a later `kb init` -- a hand-edit here does not survive re-init.
name: kb-test-stale
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
concurrency:
  group: kb-test-stale
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  STRATA_KB_HUB: ${{ vars.STRATA_KB_HUB }}
  KB_HUB_TOKEN: ${{ secrets.KB_HUB_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  LABEL: kb-test-stale
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install strata-kb=={version}
      - name: Authenticate the hub URL (private hub only)
        if: env.KB_HUB_TOKEN != ''
        run: |
          scheme="${STRATA_KB_HUB%%://*}"
          rest="${STRATA_KB_HUB#*://}"
          echo "STRATA_KB_HUB=${scheme}://x-access-token:${KB_HUB_TOKEN}@${rest}" >> "$GITHUB_ENV"
      - name: Check strategy and test cases
        id: sweep
        run: |
          # 0 = nothing drifted, 2 = warnings only, 1 = a broken target or an
          # error. Anything other than 0/1/2 is a crash: fail the job rather
          # than rewrite the issue from a half-written report.
          set +e
          kb test stale --md --hub "$STRATA_KB_HUB" > "$RUNNER_TEMP/stale.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/stale.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -gt 2 ]; then exit "$rc"; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Keep the drift issue in step
        run: |
          gh label create "$LABEL" --color D93F0B \
            --description "The test strategy or test cases no longer match the hub" \
            --force >/dev/null
          number="$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ "${{ steps.sweep.outputs.rc }}" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" \
                --comment "The test strategy and test cases match the hub again."
            fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/stale.md"
          else
            gh issue create --label "$LABEL" \
              --title "Test strategy drift" \
              --body-file "$RUNNER_TEMP/stale.md"
          fi
