services:
  hub:
    image: ghcr.io/vuonglq01685/strata-kb:v{version}
    ports: ["8321:8321"]
    env_file: .env
    # Round-4 blast-radius containment for the intake HTTP service's HIGH-1
    # fix: measured ~74 MiB RSS at rest (api+ui, warmed search index, no
    # MCP mount) plus ~56 MiB per worst-shape-but-legitimate publish
    # (a single ~49 MiB member at DEFAULT_MAX_TAR). intake_publish's own
    # CapacityLimiter caps concurrent publishes at 2, so ~186 MiB is the
    # measured floor -- this leaves generous unmeasured headroom for the
    # /mcp mount, uvicorn, and general overhead. See the round-4 report for
    # the harness. Retune from real `docker stats` if this proves wrong.
    mem_limit: 512m
    # H2 (round 5): restored -- the round-4 mem_limit edit deleted these two
    # mounts from this template and from the repo-root docker-compose.yml
    # (the child template kept its). A scaffolded hub without `./:/data`
    # boots against an empty /data (Dockerfile: WORKDIR /data, `--kb
    # /data/.kb --hub /data`), and without the cache mount re-downloads the
    # embedding model every restart. Pinned by
    # test_scaffolded_compose_pins_the_hub_data_and_model_volumes.
    volumes:
      - ./:/data
      - kb-model-cache:/home/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8321/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  kb-model-cache:
