# Strata — repo config (commit to git).
# kind: this repo's role. "dev" is a product code repo — it consumes the
#       shared KB while implementing BA tickets, and publishes generated
#       knowledge about its OWN source code (<repo_id>-code, live via
#       kb-code.yml) plus curated service knowledge (<repo_id>-svc,
#       seeded once via `dev-code-seed` and accrued per ticket via
#       `kb svc note`). It never ingests documents from outside the repo
#       (that's what `child` repos do).
kind: dev
# hub: git URL or kb-hub path of the MAIN HUB — the ONLY read source for
#      kb query / kb resolve / MCP. FILL THIS IN before implementing tickets.
#      This file is committed: never put a token in `hub:`. A URL that
#      needs one goes in the STRATA_KB_HUB environment variable, which
#      overrides this line (`kb doctor` warns on a committed credential).
hub: ""
# repo_id: repo name on the federation (pre-filled from the folder name)
repo_id: "{repo_id}"
# intake: https://kb.internal:8321   # publish code knowledge via OIDC CI
#         (zero secrets in this repo). This repo must also be allowlisted in
#         the hub's federation/registry.yaml before publishing works.
intake: ""
