name: kb-code

# Publishing is `kb publish`: it tags the commit kb-publish/<ts> and pushes the
# tag, and the intake accepts an OIDC token only from a refs/tags/kb-publish/*
# ref (a push to main is refused with HTTP 403, #100). workflow_dispatch
# re-runs a publish only when started on such a tag.
on:
  push:
    tags: ["kb-publish/*"]
  pull_request:
  workflow_dispatch:

# Two quick `kb publish` runs must not race two `kb ci-publish` runs each
# opening their own hub PR against the same -code document (task review,
# Important 7). Every publish tag shares one group; PRs keep one per ref.
# cancel-in-progress stays false: a publish run must finish once started,
# never be killed mid-PR — the next tag's run simply waits its turn.
concurrency:
  group: kb-code-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  # PR: validate only. Never publishes. `kb build` regenerates -code from
  # the merge ref first (it is never committed), so this validates what the
  # merge would publish — and catches a malformed -svc edit or a `pending`
  # section committed before review, before merge, not after.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install strata-kb=={version}
      - run: kb build

  publish:
    if: startsWith(github.ref, 'refs/tags/kb-publish/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC — no secrets in this repo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install strata-kb=={version}
      # Ingest configuration (SQLite paths, extra tags) lives in
      # .kb/config.yaml under `code_ingest:` — shared with every local
      # refresh, and safe from `kb init --kind dev`, which overwrites this
      # file on every re-run. Never add --db flags here.
      # NOTE: the flag that scaffolds a placeholder -svc document is
      # deliberately never passed here. CI must not create `pending` content
      # — it would fail its own `kb build` step. Seeding and amending the
      # curated -svc document are human, local actions (see /dev-code-seed).
      - run: kb code-ingest
      - run: kb build
      - run: kb ci-publish
