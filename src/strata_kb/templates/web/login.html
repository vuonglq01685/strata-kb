<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Strata</title>
<link rel="stylesheet" href="/ui/static/style.css?v={{ asset_v }}">
</head>
<body>
<div class="login-card">
  <span class="brand-mark">KB</span>
  <h1>Sign in to CENTER·KB</h1>
  <p class="lede">Sign in with your hub account.</p>
  {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
  <form method="post" action="/ui/login">
    <label style="display:flex; flex-direction:column; gap:6px">
      <span class="kicker">Username</span>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label style="display:flex; flex-direction:column; gap:6px">
      <span class="kicker">Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="meta-line">/api and /mcp keep using the bearer token.</p>
</div>
</body>
</html>
